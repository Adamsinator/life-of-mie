<!doctype html>
<html lang="en">
<head>
  <style>html, body { background: #fbf1ef; } @media (prefers-color-scheme: dark) { html, body { background: #1d1520; } }</style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life of Mie">
  <meta name="theme-color" content="#2f1d2b">
  <title>Life of Mie</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/akvarel.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Akvarel: painted edges that wobble a little, with the grain of watercolour paper -->
      <filter id="akvarel" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="9" result="g"/>
        <feColorMatrix in="g" type="matrix" values="0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .18  0 0 0 .16 0" result="g2"/>
        <feComposite in="g2" in2="d" operator="in" result="g3"/>
        <feMerge><feMergeNode in="d"/><feMergeNode in="g3"/></feMerge>
      </filter>
      <filter id="akvarel-soft" x="-3%" y="-3%" width="106%" height="106%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="5" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
  <div id="app"></div>
  <script src="js/i18n.js"></script>
  <script src="js/lang-da.js"></script>
  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
